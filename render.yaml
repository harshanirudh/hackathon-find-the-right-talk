services:
  - type: web
    name: find-the-right-talk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: ELASTICSEARCH_SEMANTIC_PROVIDER
        value: elastic
      - key: ELASTICSEARCH_INFERENCE_ID
        value: .jina-embeddings-v5-text-small
      - key: OPENAI_SMART_SEARCH_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_QUERY_MODEL
        value: gpt-4.1-mini
