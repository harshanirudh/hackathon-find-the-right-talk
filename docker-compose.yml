services:
  ollama:
    image: ollama/ollama:0.40.15
    profiles: [local-ai]
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: "2m"
    volumes:
      - ./.local-ai/ollama:/root/.ollama
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # Work around bundled JVM SIGILL on Apple Silicon Docker hosts.
      # Applies to the launcher JVM as well as the Elasticsearch JVM.
      _JAVA_OPTIONS: -XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  es-data:
